plugins {
    id "com.android.application"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

android {
    namespace "com.silverguardian.prototype"
    compileSdk 34

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.silverguardian.prototype"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0-prototype"

        buildConfigField "String", "ZHIPU_API_KEY", "\"${localProperties.getProperty('zhipu.api.key', 'YOUR_ZHIPU_API_KEY')}\""
        buildConfigField "String", "AMAP_API_KEY", "\"${localProperties.getProperty('amap.api.key', 'YOUR_AMAP_KEY')}\""
        buildConfigField "String", "QWEATHER_API_KEY", "\"${localProperties.getProperty('qweather.api.key', '')}\""
        buildConfigField "String", "QWEATHER_API_HOST", "\"${localProperties.getProperty('qweather.api.host', '')}\""

        manifestPlaceholders = [AMAP_KEY: localProperties.getProperty('amap.api.key', 'YOUR_AMAP_KEY')]
    }

    signingConfigs {
        release {
            storeFile file("../silver-guardian-release.jks")
            storePassword "android123"
            keyAlias "silver-guardian"
            keyPassword "android123"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.core:core:1.12.0"
    implementation "androidx.drawerlayout:drawerlayout:1.2.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "com.google.android.material:material:1.11.0"
    implementation "com.github.bumptech.glide:glide:4.16.0"
    annotationProcessor "com.github.bumptech.glide:compiler:4.16.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation files('libs/AMap3DMap_11.2.000_AMapSearch_9.8.0_AMapLocation_11.2.000_20260529.jar')

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.11.1"
    testImplementation "androidx.test:core:1.5.0"
    testImplementation "androidx.test.ext:junit:1.1.5"

    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test:runner:1.5.2"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
    androidTestImplementation "androidx.test.espresso:espresso-contrib:3.5.1"
    androidTestImplementation "androidx.test.espresso:espresso-intents:3.5.1"
}
